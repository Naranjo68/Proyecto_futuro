# Perfil "test": las pruebas de repositorio (@DataJpaTest / @JdbcTest) usan la rama test-<usuario> de Neon.
spring.datasource.url=${KALA_TEST_DB_URL}
spring.datasource.username=${KALA_TEST_DB_USER}
spring.datasource.password=${KALA_TEST_DB_PASSWORD}

# Nunca borrar el esquema desde las pruebas.
spring.flyway.clean-disabled=true
