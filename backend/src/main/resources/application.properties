spring.application.name=backend

#numero de puerto
server.port=8090

# Base de datos (Neon / PostgreSQL). Los valores salen de variables de entorno: nunca van en el repositorio.
spring.datasource.url=${KALA_DB_URL}
spring.datasource.username=${KALA_DB_USER}
spring.datasource.password=${KALA_DB_PASSWORD}

# El esquema lo crea Flyway; Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway: cada dev trabaja en su propia rama de Neon, asi que al integrar pueden llegar
# versiones menores que las ya aplicadas y versiones que esta rama no conoce.
spring.flyway.enabled=true
spring.flyway.out-of-order=true
spring.flyway.ignore-migration-patterns=*:missing

# Privacidad diferencial local
kala.ldp.probabilidad-verdad=0.75
kala.privacidad.n-minimo=30
kala.privacidad.epsilon-maximo-persona=20.0
kala.ventana.zona=America/Lima
kala.sesion.secreto=${KALA_SESSION_SECRET}

# Administrador inicial (A2-L1): si faltan estas variables no se crea ninguno
kala.admin.email=${KALA_ADMIN_EMAIL:}
kala.admin.password=${KALA_ADMIN_PASSWORD:}

# JWT (A2-L4)
app.jwt.issuer=kala-api
app.jwt.ttl-minutes=30
app.jwt.secret-base64=${JWT_SECRET_BASE64}
